  <ul>
    <li>
      <strong>Dishes:</strong> {{ num_dishes }}

    </li>
    <li>
      <strong>Dish types:</strong> {{ num_dish_types }}
    </li>
    <li>
      <strong>Ingredients:</strong> {{ num_ingredients }}
    </li>
  </ul>
{% endblock %}
