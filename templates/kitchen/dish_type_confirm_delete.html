{% extends "base.html" %}

{% block content %}
  <h1>Delete dish type?</h1>
  <p>
      This action may also delete dishes associated with this type.
  </p>
  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes" class="btn btn-danger">

    <a href="{%url 'kitchen:dish-type-list' %}" class="btn btn-secondary">
        Cancel
    </a>
  </form>
{% endblock %}
