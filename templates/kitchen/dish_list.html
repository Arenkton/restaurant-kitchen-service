{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Dishes</h1>

    <a
      href="{% url 'kitchen:dish-create' %}"
      class="btn btn-primary"
    >
      Create dish
    </a>
  </div>

  <div class="card mb-4">
    <div class="card-header">
      Dish list
    </div>

    <div class="card-body">
      {% if dishes %}
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Dish type</th>
                <th>Price</th>
              </tr>
            </thead>

            <tbody>
              {% for dish in dishes %}
                <tr>
                  <td>{{ dish.id }}</td>

                  <td>
                    <a href="{% url 'kitchen:dish-detail' pk=dish.pk %}">
                      {{ dish.name }}
                    </a>
                  </td>

                  <td>{{ dish.dish_type }}</td>

                  <td>{{ dish.price }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% else %}
        <p class="mb-0">There are no dishes yet.</p>
      {% endif %}
    </div>
  </div>
{% endblock %}
