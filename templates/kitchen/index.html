{% extends "base.html" %}

{% block content %}
  <h1 class="mb-4">Dashboard</h1>

  <div class="row">

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-primary h-100">
        <div class="card-body">
          <div class="small text-muted">Dishes</div>
          <div class="fs-2 fw-bold">{{ num_dishes }}</div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-success h-100">
        <div class="card-body">
          <div class="small text-muted">Cooks</div>
          <div class="fs-2 fw-bold">{{ num_cooks }}</div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-warning h-100">
        <div class="card-body">
          <div class="small text-muted">Dish types</div>
          <div class="fs-2 fw-bold">{{ num_dish_types }}</div>
        </div>
      </div>
    </div>

    <div class="col-xl-3 col-md-6 mb-4">
      <div class="card border-danger h-100">
        <div class="card-body">
          <div class="small text-muted">Ingredients</div>
          <div class="fs-2 fw-bold">{{ num_ingredients }}</div>
        </div>
      </div>
    </div>

  </div>
{% endblock %}
