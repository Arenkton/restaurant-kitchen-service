{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Ingredients</h1>

    <a
      href="{% url 'kitchen:ingredient-create' %}"
      class="btn btn-primary"
    >
      Create ingredient
    </a>
  </div>

  <div class="card mb-4">
    <div class="card-header">
      Ingredient list
    </div>

    <div class="card-body">
      {% if ingredients %}
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead>
              <tr>
                <th>Name</th>
                <th>Update</th>
                <th>Delete</th>
              </tr>
            </thead>

            <tbody>
              {% for ingredient in ingredients %}
                <tr>
                  <td>{{ ingredient.name }}</td>

                  <td>
                    <a
                      href="{% url 'kitchen:ingredient-update' pk=ingredient.pk %}"
                      class="btn btn-secondary"
                    >
                      Update
                    </a>
                  </td>

                  <td>
                    <a
                      href="{% url 'kitchen:ingredient-delete' pk=ingredient.pk %}"
                      class="btn btn-danger"
                    >
                      Delete
                    </a>
                  </td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      {% else %}
        <p class="mb-0">There are no ingredients yet.</p>
      {% endif %}
    </div>
  </div>
{% endblock %}
