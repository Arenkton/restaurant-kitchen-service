{% extends "base.html" %}

{% block content %}
  <h1>Delete dish?</h1>

  <p>
    Are you sure you want to delete "{{ object }}"?
  </p>

  <form action="" method="post">
    {% csrf_token %}

    <input type="submit" value="Yes, delete" class="btn btn-danger">

    <a
      href="{% url 'kitchen:dish-detail' pk=object.pk %}"
      class="btn btn-secondary"
    >
      Cancel
    </a>
  </form>
{% endblock %}
