{% extends "base.html" %}

{% block content %}
  <h1>
    Dish types
    <a href="{% url 'kitchen:dish-type-create' %}" class="btn btn-primary">
      Create
    </a>
  </h1>

  {% if dish_types %}
    <table class="table">
      <tr>
        <th>Name</th>
      </tr>

      {% for dish_type in dish_types %}
        <tr>
          <td>{{ dish_type.name }}</td>
        </tr>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no dish types yet.</p>
  {% endif %}
{% endblock %}
